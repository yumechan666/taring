<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Sabit Taring Malam</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <style>
    #startup-error { position:absolute; inset:0; z-index:100; background:#10131c; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; text-align:center; }
    #startup-error[hidden] { display:none; }
    #startup-error button { padding:12px 24px; }
    .pause-overlay .panel { overflow-y:auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="startup-error" hidden role="alert">
    <strong>Game belum dapat dimuat</strong><span id="error-detail"></span>
    <button onclick="location.reload()">Coba lagi</button>
    <button onclick="window.taringClose({})">Kembali ke menu</button>
  </div>
  <script>
    window.taringClose = function (result) {
      if (window.TaringNative) window.TaringNative.close(JSON.stringify(result));
      else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ type: 'taring-close', result }), location.origin);
    };
    window.showGameError = function (error) {
      console.error(error);
      document.getElementById('error-detail').textContent = error?.message || String(error);
      document.getElementById('startup-error').hidden = false;
    };
    window.addEventListener('error', event => window.showGameError(event.error || event.message));
    window.addEventListener('unhandledrejection', event => window.showGameError(event.reason));
  </script>
  <script type="module" src="./android.js"></script>
</body>
</html>
